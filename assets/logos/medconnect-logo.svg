<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="MedConnect">
  <!--
    Lambang MedConnect.

    Bentuknya salib medis yang tiap ujungnya berakhir sebagai SIMPUL, dan
    simpul-simpul itu terhubung satu sama lain — persis yang dikerjakan
    aplikasi ini: menghubungkan dokter, apotek, klinik, dan admin dari
    berbagai tempat menjadi satu jaringan layanan.

    Digambar sebagai SVG, bukan gambar raster, karena dipakai dari ukuran
    28px di menu samping sampai 96px di layar pembuka dan 512px di ikon
    aplikasi. Satu berkas untuk semua ukuran, dan tidak pernah pecah.
  -->
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3980"/>
      <stop offset="0.55" stop-color="#2b7ee0"/>
      <stop offset="1" stop-color="#22c9a4"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#mcBg)"/>

  <!-- Garis penghubung antar simpul: jaringannya, digambar lebih dulu supaya
       berada di belakang simpul-simpulnya. -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M48 26 L48 70"/>
    <path d="M26 48 L70 48"/>
  </g>

  <!-- Palang medis di tengah. -->
  <path d="M42 38 h12 v-9 a3 3 0 0 1 3-3 h0 a3 3 0 0 1 3 3 v9 h9 a3 3 0 0 1 3 3 v0 a3 3 0 0 1-3 3 h-9 v9 a3 3 0 0 1-3 3 h0 a3 3 0 0 1-3-3 v-9 h-12 z"
        fill="none"/>
  <path d="M43.5 43.5 h-13 a4 4 0 0 0-4 4 v1 a4 4 0 0 0 4 4 h13 v13 a4 4 0 0 0 4 4 h1 a4 4 0 0 0 4-4 v-13 h13 a4 4 0 0 0 4-4 v-1 a4 4 0 0 0-4-4 h-13 v-13 a4 4 0 0 0-4-4 h-1 a4 4 0 0 0-4 4 z"
        fill="#ffffff"/>

  <!-- Empat simpul di ujung salib. -->
  <g fill="#ffffff">
    <circle cx="48" cy="22" r="7"/>
    <circle cx="48" cy="74" r="7"/>
    <circle cx="22" cy="48" r="7"/>
    <circle cx="74" cy="48" r="7"/>
  </g>
  <g fill="#2b7ee0">
    <circle cx="48" cy="22" r="3"/>
    <circle cx="48" cy="74" r="3"/>
    <circle cx="22" cy="48" r="3"/>
    <circle cx="74" cy="48" r="3"/>
  </g>
</svg>
